<!DOCTYPE html>
<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Q2 DRILL 1 </title>
    <link href=link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<html>
<head>

    <style>
        body { background-image: url("pickleballbg.jpg");
            background-size: cover;
            background-position: center;
         background-repeat: no-repeat;
         background-attachment: fixed;
         text-align: center;
            font-family: sans-serif;
        }
            
        

        .title-banner {
            background: lightpink;
            border-radius: 20px;
            width: 60%;
            margin: 20px auto;
            padding: 10px;
            color:black;
        }

        .title-banner h2 {
            margin: 0;
            font-family: "Times New Roman", serif;
            font-size: 30px;
            font-weight: bold;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 20px auto;
        }

        .card {
            background: white;
            border-radius: 8px;
            width: 220px;
            text-align: left;
            font-family: times new roman, serif;
        }

        .card h4 {
            background:lightpink;
            margin: 0;
            padding: 10px;
            font-family: times new roman,serif;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="title-banner">
        <h2>🏓 Beginner's Guide to Pickleball🥒</h2>
    </div>

    <img src="pickleball.png" width="120" alt="Pickleball">

    <div class="card-container">

        <div class="card">
            <h4>Basic Rules</h4>
            <ul>
                <li>Serve diagonally</li>
                <li>Double bounce rule</li>
                <li>No volley zone</li>
                <li>Scoring</li>
            </ul>
        </div>

        <div class="card">
            <h4>Pickleball Equipment</h4>
            <ul>
                <li>Paddle</li>
                <li>Plastic ball</li>
                <li>Net</li>
                <li>Court</li>
            </ul>
        </div>

        <div class="card">
            <h4>Basic Techniques</h4>
            <ul>
                <li>Forehand and backhand</li>
                <li>Serving techniques</li>
                <li>Dinking</li>
                <li>Positioning</li>
            </ul>
        </div>

    </div>

</body>
</html>


</body>
</html>
